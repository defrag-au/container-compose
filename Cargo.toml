[workspace]
resolver = "2"
members = [
    "crates/stack",
    "crates/runtime",
    "crates/plan",
    "crates/cli",
    "dev/fake-container",
]

# The workspace is the unit: the stack model is a library with no runtime, no
# CLI and no I/O beyond reading the file it validates; the binary is a separate
# crate. `crates/supervisor` joins this list when the supervisor lands.
[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
container-compose-plan = { path = "crates/plan" }
container-compose-runtime = { path = "crates/runtime" }
container-compose-stack = { path = "crates/stack" }

assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
