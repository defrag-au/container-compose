[workspace]
resolver = "2"
members = [
    "crates/stack",
    "crates/runtime",
    "crates/plan",
    "crates/supervisor",
    "crates/top",
    "crates/cli",
    "dev/fake-container",
]

# The workspace is the unit: the stack model is a library with no runtime, no
# CLI and no I/O beyond reading the file it validates; the binary is a separate
# crate. `crates/supervisor` joins this list when the supervisor lands.
[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
container-compose-plan = { path = "crates/plan" }
container-compose-runtime = { path = "crates/runtime" }
container-compose-stack = { path = "crates/stack" }
container-compose-supervisor = { path = "crates/supervisor" }
container-compose-top = { path = "crates/top" }

assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
# `top` only. The crossterm backend alone: the calendar widget, the macros and
# the layout cache are default features nothing here uses. Ratatui re-exports
# the crossterm it was built against as `ratatui::crossterm`; there is no
# separate crossterm pin, so two versions cannot end up in the tree.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
toml = "0.8"
