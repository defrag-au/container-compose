[workspace]
resolver = "2"

[package]
name = "container-compose"
version = "0.1.0"
edition = "2021"
publish = false
description = "A small orchestration layer over Apple's container runtime"

[lib]
name = "container_compose"
path = "src/lib.rs"

[[bin]]
name = "container-compose"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
